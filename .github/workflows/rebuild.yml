name: Rebuild Arabic template

# Daily: fetch the numb3rs AIOStreams template, reapply the Arabic layer and
# publish it here. The version only changes when the content changed, so
# AIOStreams shows "Apply Update" exactly when there is something new.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_aiostreams.py"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the numb3rs template
        run: >
          curl -fsSL -o /tmp/numb3rs.json
          https://raw.githubusercontent.com/luckynumb3rs/stremio-perfect-setup/main/templates/AIOStreams.json

      - name: Build the Arabic edition
        run: |
          mkdir -p templates
          python3 scripts/build_aiostreams.py /tmp/numb3rs.json /tmp/out.json \
            --source-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/templates/AIOStreams-Arabic-Edition.json" \
            --previous templates/AIOStreams-Arabic-Edition.json
          mv /tmp/out.json templates/AIOStreams-Arabic-Edition.json

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain templates)" ]; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/AIOStreams-Arabic-Edition.json
          git commit -m "Rebuild Arabic template from numb3rs"
          git push
